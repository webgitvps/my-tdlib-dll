name: Manual_Build_TDLib_Windows_Final

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择要编译的 TDLib 分支'
        required: true
        default: 'master'

jobs:
  build_job:
    runs-on: windows-2022
    
    steps:
      - name: 1. 安装所有必要工具 (含 ZLIB)
        run: |
          # 增加 zlib 安装
          choco install cmake gperf php openssl zlib -y

      - name: 2. 下载 TDLib 源码
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.branch }}

      - name: 3. 探测路径并配置 CMake
        shell: pwsh
        run: |
          # 自动寻找 OpenSSL 路径
          $sslPath = ""
          $possibleSslPaths = @("C:\Program Files\OpenSSL-Win64", "C:\Program Files\OpenSSL")
          foreach ($p in $possibleSslPaths) {
              if (Test-Path "$p\include\openssl\ssl.h") { $sslPath = $p; break }
          }

          # 自动寻找 ZLIB 路径 (Choco 默认路径)
          $zlibPath = "C:\Program Files\zlib"
          
          Write-Host "OpenSSL 路径: $sslPath"
          Write-Host "ZLIB 路径: $zlibPath"
          
          mkdir build
          cd build
          
          # 配置时显式指定 ZLIB 的库文件和头文件路径
          cmake -A x64 `
                -DCMAKE_INSTALL_PREFIX:PATH=../tdlib_install `
                -DOPENSSL_ROOT_DIR="$sslPath" `
                -DZLIB_INCLUDE_DIR="$zlibPath\include" `
                -DZLIB_LIBRARY="$zlibPath\lib\zlib.lib" `
                -DCMAKE_BUILD_TYPE=Release ..

      - name: 4. 执行编译
        shell: pwsh
        run: |
          cd build
          cmake --build . --target install --config Release --parallel 4

      - name: 5. 整理所有 DLL 文件
        shell: pwsh
        run: |
          if (!(Test-Path "tdlib_install/bin")) { New-Item -ItemType Directory -Path "tdlib_install/bin" }
          
          # 拷贝 OpenSSL 的 DLL
          $sslBin = if (Test-Path "C:\Program Files\OpenSSL-Win64\bin") { "C:\Program Files\OpenSSL-Win64\bin" } else { "C:\Program Files\OpenSSL\bin" }
          Copy-Item "$sslBin\*.dll" "tdlib_install/bin/" -Force -ErrorAction SilentlyContinue
          
          # 拷贝 ZLIB 的 DLL
          if (Test-Path "C:\Program Files\zlib\bin\zlib1.dll") {
              Copy-Item "C:\Program Files\zlib\bin\zlib1.dll" "tdlib_install/bin/" -Force
          }

      - name: 6. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-windows-x64-ready
          path: tdlib_install/bin/*.dll
